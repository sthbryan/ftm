name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GO_VERSION: '1.25'
  BUN_VERSION: '1.3'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-go:
    name: Lint & Test Go
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Stub embedded assets
        run: |
          mkdir -p internal/web/static
          touch internal/web/static/index.html

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet $(go list ./... | grep -v '/cmd/ftm-desktop')

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m ./cmd/ftm/... ./internal/...

      - name: Test
        run: go test -race -v $(go list ./... | grep -v '/cmd/ftm-desktop')

      # The desktop shell needs GTK to compile here, but its import graph does
      # not: it must reach the core through internal/service, never the TUI.
      - name: Desktop does not import the TUI
        run: |
          if go list -deps ./cmd/ftm-desktop | grep -E "^(github.com/sthbryan/ftm/internal/app(/|$)|charm.land/bubbletea)"; then
            echo "cmd/ftm-desktop must not import internal/app or Bubble Tea"
            exit 1
          fi

  build-windows:
    name: Build & Vet on Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Stub embedded assets
        run: |
          mkdir -p internal/web/static
          touch internal/web/static/index.html

      # Windows is the primary target and none of this used to be compiled on
      # it. unsafeptr is disabled because the COM vtable glue in
      # internal/autostart is uintptr by design.
      - name: Vet
        run: go vet -unsafeptr=false $(go list ./... | grep -v '/cmd/ftm-desktop')

      - name: Build the CLI
        run: go build -trimpath -o ftm-windows-x64.exe ./cmd/ftm

      - name: Build and test the desktop shell
        run: |
          go build -trimpath -ldflags "-H windowsgui" -o ftm-desktop-windows-x64.exe ./cmd/ftm-desktop
          go test ./cmd/ftm-desktop/

      - name: Test the platform-independent packages
        run: go test ./internal/config/ ./internal/i18n/ ./internal/web/ ./internal/store/... ./internal/platform/... ./internal/events/ ./internal/service/

  lint-frontend:
    name: Lint & Test Frontend
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install
        run: cd web && bun install

      - name: Typecheck
        run: cd web && bun run check

      - name: Test
        run: cd web && bun run test
