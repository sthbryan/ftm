# Build the Linux desktop AppImage on demand (no GitHub Release).
# Run from Actions → "Desktop AppImage" → Run workflow.
# Download the appimage-ftm-desktop artifact when the job finishes.
name: Desktop AppImage

on:
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  BUN_VERSION: 'latest'

concurrency:
  group: desktop-appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-appimage:
    name: Build Linux desktop AppImage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config gcc \
            libayatana-appindicator3-dev librsvg2-common libgdk-pixbuf2.0-0 \
            gsettings-desktop-schemas adwaita-icon-theme imagemagick

      - name: Build web assets
        run: |
          cd web && bun install && bun run build
          rm -rf ../internal/transport/httpapi/static
          mkdir -p ../internal/transport/httpapi/static
          cp -r dist/* ../internal/transport/httpapi/static/
          touch ../internal/transport/httpapi/static/.gitkeep

      - name: Build desktop
        run: |
          mkdir -p cmd/ftm-desktop/build/bin
          CGO_ENABLED=1 go build -tags "production,gtk3" -ldflags "-s -w" \
            -o cmd/ftm-desktop/build/bin/ftm-desktop-linux ./cmd/ftm-desktop

      - name: Package AppImage
        run: ./scripts/package-appimage.sh cmd/ftm-desktop/build/bin/ftm-desktop-linux cmd/ftm-desktop/build/bin

      - name: Smoke test the AppImage
        run: |
          APPIMAGE=cmd/ftm-desktop/build/bin/ftm-desktop-linux-x86_64.AppImage
          test -x "$APPIMAGE"
          ls -lh "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --appimage-extract >/dev/null
          test -f squashfs-root/ftm-desktop.desktop
          test -f squashfs-root/ftm-desktop.png
          test -f squashfs-root/usr/lib/libwebkit2gtk-4.1.so.0
          test -f squashfs-root/usr/lib/libgtk-3.so.0
          test -x squashfs-root/usr/lib/webkit2gtk-4.1/WebKitNetworkProcess
          test -x squashfs-root/usr/lib/webkit2gtk-4.1/WebKitWebProcess
          grep -q WEBKIT_LINK squashfs-root/apprun-hooks/webkit.sh
          grep -aq '/tmp/ftm-webkit-4.1' squashfs-root/usr/lib/libwebkit2gtk-4.1.so.0
          echo "AppImage is self-contained"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: appimage-ftm-desktop
          path: cmd/ftm-desktop/build/bin/*.AppImage
          retention-days: 14
